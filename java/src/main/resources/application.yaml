spring:
  main:
    allow-bean-definition-overriding: true
    web-application-type: none
  application:
    name: open-account
  # Temporal connection, defaulting to a local dev server. The cloud profiles override it:
  # application-tc.yaml (mTLS) and application-tc-apikey.yaml (API key), chosen by startcloudworker.sh.
  temporal:
    namespace: ${TEMPORAL_NAMESPACE:default}
    connection:
      target: ${TEMPORAL_ADDRESS:127.0.0.1:7233}
  # Claim check storage (claimcheck/), used when USE_CLAIM_CHECK=true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
