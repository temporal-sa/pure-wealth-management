# Temporal Cloud with mTLS. startcloudworker.sh sets the environment variables below from
# ../setcloudenv.sh.
spring:
  temporal:
    namespace: ${TEMPORAL_NAMESPACE}
    connection:
      target: ${TEMPORAL_ADDRESS}
      mtls:
        # The key must be unencrypted PKCS8 (-----BEGIN PRIVATE KEY-----); see startcloudworker.sh
        key-file: ${TEMPORAL_KEY_PKCS8_PATH}
        cert-chain-file: ${TEMPORAL_CERT_PATH}
        insecure-trust-manager: false
